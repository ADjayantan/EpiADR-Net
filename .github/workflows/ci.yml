name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install numpy pandas scikit-learn rdkit xgboost matplotlib pytest

      - name: Lint
        run: ruff check . --ignore E501,F401,E402

      - name: Test suite
        run: pytest -v tests/test_honest_pipeline.py tests/test_mechanism.py

      # The audit is a regression test: if anyone reconnects the broken pipeline
      # or reintroduces an organ-invariant target, these assertions fail.
      - name: Pipeline validity audit
        run: |
          python scripts/audit_pipeline.py
          python - <<'PY'
          import json
          f = json.load(open("results/audit_findings.json"))
          c = f["C_label_organ_dependence"]
          assert c["csv_unique_molecules"] == 1465, "dataset changed unexpectedly"
          print("audit reproduced:", c["csv_unique_molecules"], "molecules")
          PY

      - name: Leakage check on the scaffold splits
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from epiadr.task import load_task
          from epiadr.splits import scaffold_kfold, verify_no_leakage
          t = load_task("data/adr_records.csv")
          for i, (tr, te) in enumerate(scaffold_kfold(t.molecules, 5, 42), 1):
              s = verify_no_leakage(tr, te)
              print(f"fold {i}: {s['train_molecules']} train / {s['test_molecules']} test, "
                    f"0 shared molecules, 0 shared scaffolds")
          PY
